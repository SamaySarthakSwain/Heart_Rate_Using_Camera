<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Heart Rate Monitor</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.75);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent: #0ea5e9;
            --accent-glow: rgba(14, 165, 233, 0.4);
            --success: #10b981;
            --danger: #f43f5e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top, #1e293b, var(--bg-color) 80%);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .header {
            text-align: center;
            margin-bottom: 10px;
        }

        .header h1 {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 800;
            margin: 0;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-muted);
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            font-weight: 300;
            margin-top: 8px;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        @media (min-width: 900px) {
            .grid-layout {
                grid-template-columns: 1.8fr 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
        }

        .video-container {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            aspect-ratio: 4/3;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        canvas { display: none; }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 20px;
            width: 100%;
            justify-content: center;
        }

        select {
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
            background: rgba(15, 23, 42, 0.8);
            color: white;
            border: 1px solid var(--border-color);
            outline: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        select:hover {
            border-color: var(--accent);
        }

        button {
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            border-radius: 10px;
            border: none;
            background: var(--accent);
            color: white;
            box-shadow: 0 0 15px var(--accent-glow);
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px var(--accent-glow);
            background: #0284c7;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            width: 100%;
            height: 100%;
        }

        .metric-box {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px 20px;
            text-align: center;
            transition: transform 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .metric-box:hover {
            transform: translateY(-5px);
        }

        .metric-title {
            font-size: 1rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .metric-value {
            font-size: clamp(3rem, 6vw, 4.5rem);
            font-weight: 800;
            color: var(--success);
            line-height: 1;
            text-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
        }

        .metric-value.poor {
            color: var(--danger);
            text-shadow: 0 0 20px rgba(244, 63, 94, 0.4);
        }

        .status-badge {
            margin-top: 15px;
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            font-size: 0.9rem;
            font-weight: 600;
            border: 1px solid rgba(56, 189, 248, 0.2);
            text-align: center;
        }

        .wave-container {
            width: 100%;
            height: 120px;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }
        
        #waveformCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Contactless Vitals</h1>
            <p>Real-time heart rate estimation via AI & rPPG technology</p>
        </div>

        <div class="grid-layout">
            <!-- Camera Section -->
            <div class="card">
                <div class="video-container">
                    <video id="video" autoplay playsinline></video>
                </div>
                <canvas id="canvas" width="640" height="480"></canvas>
                
                <div class="controls">
                    <select id="cameraSelect">
                        <option value="user">Front Camera</option>
                        <option value="environment">Back Camera</option>
                    </select>
                    <button id="startBtn">Start Monitoring</button>
                </div>
            </div>

            <!-- Metrics Section -->
            <div class="card">
                <div class="metrics-grid">
                    <div class="metric-box">
                        <div class="metric-title">Heart Rate</div>
                        <div id="hr-display" class="metric-value">--</div>
                        <div style="color: var(--text-muted); margin-top: 5px; font-size: 0.9rem;">BPM</div>
                    </div>
                    <div class="metric-box">
                        <div class="metric-title">Signal Quality</div>
                        <div id="sqi-display" class="metric-value" style="font-size: clamp(2.5rem, 5vw, 3.5rem);">0.00</div>
                        <div style="color: var(--text-muted); margin-top: 5px; font-size: 0.9rem;">SQI</div>
                    </div>
                </div>
                <div id="status-display" class="status-badge">Waiting to start...</div>
            </div>
        </div>

        <!-- Waveform Section -->
        <div class="card">
            <div class="metric-title" style="margin-bottom: 10px;">Pulse Waveform</div>
            <div class="wave-container">
                <canvas id="waveformCanvas" width="900" height="120"></canvas>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const hrDisplay = document.getElementById('hr-display');
        const sqiDisplay = document.getElementById('sqi-display');
        const statusDisplay = document.getElementById('status-display');
        const startBtn = document.getElementById('startBtn');
        const cameraSelect = document.getElementById('cameraSelect');
        
        const waveCanvas = document.getElementById('waveformCanvas');
        const waveCtx = waveCanvas.getContext('2d');
        let waveData = new Array(300).fill(0); // Holds the last 300 SQI or HR changes to visualize a mock pulse since we don't stream the full 30FPS wave over websocket to save bandwidth
        
        let ws;
        let isRunning = false;
        
        function drawWaveform(newValue) {
            // Push new value, shift old
            waveData.push(newValue);
            waveData.shift();
            
            waveCtx.clearRect(0, 0, waveCanvas.width, waveCanvas.height);
            waveCtx.beginPath();
            waveCtx.strokeStyle = '#00e676';
            waveCtx.lineWidth = 2;
            
            const sliceWidth = waveCanvas.width / waveData.length;
            let x = 0;
            
            for(let i = 0; i < waveData.length; i++) {
                // Normalize for visualization (assuming typical values hover around 0 or small variations)
                const y = waveCanvas.height / 2 - (waveData[i] * 50); 
                
                if(i === 0) {
                    waveCtx.moveTo(x, y);
                } else {
                    waveCtx.lineTo(x, y);
                }
                x += sliceWidth;
            }
            waveCtx.stroke();
        }

        // Draw initial flatline
        drawWaveform(0);

        async function startCamera() {
            try {
                if (video.srcObject) {
                    video.srcObject.getTracks().forEach(track => track.stop());
                }
                const facingMode = cameraSelect.value;
                if (facingMode === 'user') {
                    video.style.transform = 'scaleX(-1)';
                } else {
                    video.style.transform = 'scaleX(1)';
                }
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        width: 640, 
                        height: 480, 
                        frameRate: { ideal: 30 },
                        facingMode: { ideal: facingMode }
                    } 
                });
                
                // Lock Camera Constraints (Auto-exposure ruins rPPG signals)
                const track = stream.getVideoTracks()[0];
                if (track && typeof track.getCapabilities === 'function') {
                    try {
                        const capabilities = track.getCapabilities();
                        const constraints = {};
                        if (capabilities.whiteBalanceMode) constraints.whiteBalanceMode = 'manual';
                        if (capabilities.exposureMode) constraints.exposureMode = 'manual';
                        if (capabilities.focusMode) constraints.focusMode = 'manual';
                        
                        if (Object.keys(constraints).length > 0) {
                            await track.applyConstraints({ advanced: [constraints] });
                            console.log("Locked camera constraints for rPPG stability.");
                        }
                    } catch (e) {
                        console.warn("Browser does not support advanced manual camera constraints.", e);
                    }
                }

                video.srcObject = stream;
            } catch (err) {
                statusDisplay.innerText = "Error accessing camera: " + err.message;
            }
        }

        cameraSelect.addEventListener('change', () => {
            if (isRunning) {
                startCamera();
            }
        });

        function sendFrame() {
            if (!isRunning) return;
            
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const base64Data = canvas.toDataURL('image/jpeg', 0.6);
            
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(base64Data);
            }
            
            // Limit to ~30 FPS
            setTimeout(sendFrame, 33);
        }

        startBtn.addEventListener('click', () => {
            if (isRunning) return;
            isRunning = true;
            startBtn.style.display = 'none';
            statusDisplay.innerText = "Connecting to Analysis Engine...";
            
            const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${wsProtocol}//${location.host}/ws`);
            
            ws.onopen = () => {
                statusDisplay.innerText = "Connected. Initializing buffers...";
                startCamera().then(() => {
                    setTimeout(sendFrame, 1000); // Give camera time to warm up
                });
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                hrDisplay.innerText = data.hr;
                sqiDisplay.innerText = data.sqi;
                statusDisplay.innerText = "Status: " + data.status;
                
                if (data.wave_value !== undefined) {
                    drawWaveform(data.wave_value);
                }
                
                if (parseFloat(data.sqi) < 0.4) {
                    hrDisplay.classList.add('poor');
                } else {
                    hrDisplay.classList.remove('poor');
                }
            };
            
            ws.onclose = () => {
                isRunning = false;
                statusDisplay.innerText = "Disconnected.";
                startBtn.style.display = 'block';
            };
        });
    </script>
</body>
</html>
